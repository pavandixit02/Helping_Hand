global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'helpinghand-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-api-service:8000']
  
  - job_name: 'helpinghand-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'helpinghand-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
